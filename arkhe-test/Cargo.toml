[package]
name = "arkhe-test"
version = "0.1.0"
edition = "2021"
authors = ["Arkhe Project Authors"]
description = "Arkhe AGI-P2P continuous invariant test pipeline, adversarial harness, and verifiable evidence engine"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "arkhe-test"
path = "src/main.rs"

[lib]
name = "arkhe_test"
path = "src/lib.rs"
